    <style>
      html[data-lt-hold="settings"] .layout-labtech main.staff-page,
      html[data-lt-hold="test-master"] .layout-labtech main.staff-page { display: none !important; }
    </style>
    <script>
      (function () {
        var holdPath = location.pathname || '';
        if (holdPath === '/dashboard/settings') document.documentElement.setAttribute('data-lt-hold', 'settings');
        if (holdPath === '/dashboard/test-master') document.documentElement.setAttribute('data-lt-hold', 'test-master');
        if (location.hostname === 'aesthetics.e-remedium.in') {
          var mark = document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]');
          for (var n = 0; n < mark.length; n++) {
            mark[n].href = '/aesthetic-icon.png?v=1';
            if (mark[n].rel === 'icon') mark[n].type = 'image/png';
          }
        }
        if (location.hostname === 'people.e-remedium.in') {
          var peopleMark = document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]');
          for (var p = 0; p < peopleMark.length; p++) {
            peopleMark[p].href = '/brand/smilecure-icon.png?v=6';
            if (peopleMark[p].rel === 'icon') peopleMark[p].type = 'image/png';
          }
          var theme = document.querySelector('meta[name="theme-color"]');
          if (theme) theme.setAttribute('content', '#0b3a3b');
          var appTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appTitle) appTitle.setAttribute('content', 'People Management - SLPL');
          document.title = 'People Management - SLPL';
        }
        if (location.hostname === 'labtech.e-remedium.in') {
          var labMark = document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]');
          for (var q = 0; q < labMark.length; q++) {
            labMark[q].href = '/brand/smilecure-icon.png?v=6';
            if (labMark[q].rel === 'icon') labMark[q].type = 'image/png';
          }
          var labTheme = document.querySelector('meta[name="theme-color"]');
          if (labTheme) labTheme.setAttribute('content', '#0b3a3b');
          var labTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (labTitle) labTitle.setAttribute('content', 'Lab Tech - Smilecure');
          document.title = 'Lab Tech - Smilecure';
        }
        // People HRMS is host-only — bounce /people off www before the SPA boots.
        (function () {
          var host = (location.hostname || '').toLowerCase();
          var path = location.pathname || '';
          if (host === 'people.e-remedium.in') return;
          if (path !== '/people' && path.indexOf('/people/') !== 0) return;
          location.replace('https://people.e-remedium.in' + path + (location.search || '') + (location.hash || ''));
        })();
        var gone = /^\/(?:aesthetic|aesthetics|wellness\/aesthetics)\/?$/;
        function leave() {
          var host = location.hostname;
          var path = location.pathname;
          if ((host === 'www.remediumlabs.in' || host === 'remediumlabs.in') &&
              (path === '/aesthetic-admin' || path.indexOf('/aesthetic-admin/') === 0)) {
            var rest = path === '/aesthetic-admin' || path === '/aesthetic-admin/' ? '/' : path.replace(/^\/aesthetic-admin/, '');
            location.replace('https://aesthetics.e-remedium.in' + rest + location.search + location.hash);
            return;
          }
          if (gone.test(path)) location.replace('https://remediumaesthetics.in/');
        }
        leave();
        var push = history.pushState;
        history.pushState = function () {
          var result = push.apply(this, arguments);
          leave();
          return result;
        };
        addEventListener('popstate', leave);
      })();
    </script>
