# Optional Laravel/MySQL/Redis stack for the isolated RFMS instance.
# Does not replace the Node local API used by start-isolated.cmd.
# Laravel listens on host port 9180 so it does not conflict with the Node API on 9080.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rfms_isolated}
      MYSQL_USER: ${MYSQL_USER:-rfms_isolated}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rfms-isolated-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-isolated-secret}
    ports: ["4306:3306"]
    volumes: [mysql_data_isolated:/var/lib/mysql]
  redis:
    image: redis:7-alpine
    ports: ["7379:6379"]
  api:
    build: ./apps/api
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:QqK1KuK7pRMptJCG2Y6C1FBrJQYwUVQ0n3k56pYB2xw=
      APP_URL: http://localhost:9180
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-rfms_isolated}
      DB_USERNAME: ${MYSQL_USER:-rfms_isolated}
      DB_PASSWORD: ${MYSQL_PASSWORD:-rfms-isolated-secret}
      REDIS_HOST: redis
    depends_on: [mysql, redis]
    ports: ["9180:80"]
volumes:
  mysql_data_isolated:
