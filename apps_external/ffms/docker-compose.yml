services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rfms}
      MYSQL_USER: ${MYSQL_USER:-rfms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rfms-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-secret}
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:QqK1KuK7pRMptJCG2Y6C1FBrJQYwUVQ0n3k56pYB2xw=
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-rfms}
      DB_USERNAME: ${MYSQL_USER:-rfms}
      DB_PASSWORD: ${MYSQL_PASSWORD:-rfms-secret}
      REDIS_HOST: redis
    depends_on: [mysql, redis]
    ports: ["8080:80"]
volumes:
  mysql_data:
