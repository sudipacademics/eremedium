# Temporary HTTP-only vhost so certbot can issue crm.e-remedium.in.
# Replace with crm.e-remedium.in.conf after the certificate exists.

server {
    listen 80;
    listen [::]:80;
    server_name crm.e-remedium.in;

    root /opt/health-ecosystem/crm_portal/dist;
    index index.html;
    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host www.remediumlabs.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name health.localhost;
        proxy_read_timeout 120s;
        proxy_pass http://health_erpnext;
    }

    location /files/ {
        proxy_http_version 1.1;
        proxy_set_header Host www.remediumlabs.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name health.localhost;
        proxy_pass http://health_erpnext;
    }

    location /rfms-api/ {
        proxy_http_version 1.1;
        proxy_set_header Host www.remediumlabs.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://health_erpnext;
    }

    location /care-api/ {
        proxy_http_version 1.1;
        proxy_set_header Host care.e-remedium.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8095;
    }

    location /aes-api/ {
        proxy_http_version 1.1;
        proxy_set_header Host care.e-remedium.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8096/care-api/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
