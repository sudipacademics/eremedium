# Temporary HTTP-only vhost so certbot can issue crm.e-remedium.in.
# Does NOT serve the CRM app or APIs on plain HTTP (MITM risk).
# Replace with crm.e-remedium.in.conf after the certificate exists.

server {
    listen 80;
    listen [::]:80;
    server_name crm.e-remedium.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://crm.e-remedium.in$request_uri;
    }
}
