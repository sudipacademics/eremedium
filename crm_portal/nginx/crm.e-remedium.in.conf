# Smilecure CRM Portal — crm.e-remedium.in
# Same Hetzner host as remediumlabs.in (167.233.108.90).
# Static root: /opt/health-ecosystem/crm_portal/dist
# Install this file after the certificate exists:
#   /etc/nginx/sites-available/crm.e-remedium.in

server {
    listen 80;
    listen [::]:80;
    server_name crm.e-remedium.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://crm.e-remedium.in$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.e-remedium.in;

    ssl_certificate     /etc/letsencrypt/live/crm.e-remedium.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.e-remedium.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/health-ecosystem/crm_portal/dist;
    index index.html;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Must NOT use geolocation=(self) — HR check-in runs in a people.e-remedium.in iframe.
    # Use * so the iframe allow="geolocation *" can receive GPS (Permissions-Policy).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=*, payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # SPA + People HR iframe + same-origin API proxies (/api, /care-api, /gsheets).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self' https://people.e-remedium.in; frame-src 'self' https://people.e-remedium.in; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://people.e-remedium.in; form-action 'self'" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host www.remediumlabs.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name health.localhost;
        proxy_read_timeout 120s;
        proxy_pass http://health_erpnext;
    }

    location /files/ {
        proxy_http_version 1.1;
        proxy_set_header Host www.remediumlabs.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name health.localhost;
        proxy_pass http://health_erpnext;
    }

    # Block anonymous spam to public franchise lead intake via CRM origin.
    location = /rfms-api/v1/leads/public {
        if ($http_referer !~* ^https://crm\.e-remedium\.in/) {
            return 403;
        }
        proxy_http_version 1.1;
        proxy_set_header Host www.remediumlabs.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://health_erpnext;
    }

    location /rfms-api/ {
        proxy_http_version 1.1;
        proxy_set_header Host www.remediumlabs.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://health_erpnext;
    }

    location /care-api/ {
        proxy_http_version 1.1;
        proxy_set_header Host care.e-remedium.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8095;
    }

    location /aes-api/ {
        proxy_http_version 1.1;
        proxy_set_header Host care.e-remedium.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8096/care-api/;
    }

    # Google Sheets proxy — allowlisted Meta lead sheet IDs only (blocks open relay).
    # October franchise leads: 1m0zneR4HSUtC1l8dRM2YMyV9CgVetZnYIEfMqzNV2bY
    location ~ ^/gsheets/(1m0zneR4HSUtC1l8dRM2YMyV9CgVetZnYIEfMqzNV2bY)/(csv|json)/(.+)$ {
        rewrite ^/gsheets/([A-Za-z0-9_-]+)/(csv|json)/(.+)$ /spreadsheets/d/$1/gviz/tq?tqx=out:$2&sheet=$3 break;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host docs.google.com;
        proxy_set_header Accept "*/*";
        proxy_set_header User-Agent "Mozilla/5.0 SmilecureCRM/1.0";
        proxy_pass https://docs.google.com;
        proxy_buffer_size 256k;
        proxy_buffers 16 256k;
        proxy_busy_buffers_size 512k;
        proxy_temp_file_write_size 512k;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        proxy_read_timeout 90s;
        add_header Cache-Control "no-store";
    }

    location ~ ^/gsheets/(1m0zneR4HSUtC1l8dRM2YMyV9CgVetZnYIEfMqzNV2bY)/(csv|json)$ {
        set $gs_sheet $arg_sheet;
        if ($gs_sheet = "") { set $gs_sheet "October%202026"; }
        rewrite ^/gsheets/([A-Za-z0-9_-]+)/(csv|json)$ /spreadsheets/d/$1/gviz/tq?tqx=out:$2&sheet=$gs_sheet break;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host docs.google.com;
        proxy_pass https://docs.google.com;
        proxy_buffer_size 256k;
        proxy_buffers 16 256k;
        proxy_busy_buffers_size 512k;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        proxy_read_timeout 90s;
        add_header Cache-Control "no-store";
    }

    location ^~ /gsheets/ {
        return 403;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
