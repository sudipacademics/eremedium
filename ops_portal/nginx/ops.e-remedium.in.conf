# Smilecure Operations Portal — ops.e-remedium.in
# Same Hetzner host as remediumlabs.in (167.233.108.90).
# Static root: /opt/health-ecosystem/ops_portal/dist
# Install this file after the certificate exists:
#   /etc/nginx/sites-available/ops.e-remedium.in

server {
    listen 80;
    listen [::]:80;
    server_name ops.e-remedium.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://ops.e-remedium.in$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ops.e-remedium.in;

    ssl_certificate     /etc/letsencrypt/live/ops.e-remedium.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.e-remedium.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/health-ecosystem/ops_portal/dist;
    index index.html;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host www.remediumlabs.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name health.localhost;
        proxy_read_timeout 120s;
        proxy_pass http://health_erpnext;
    }

    location /files/ {
        proxy_http_version 1.1;
        proxy_set_header Host www.remediumlabs.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name health.localhost;
        proxy_pass http://health_erpnext;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
