# Bootstrap server for ops.e-remedium.in before the certificate exists.
# Serves the portal on port 80 and answers ACME challenges.
# Replace with nginx/ops.e-remedium.in.conf after certbot issues the cert.

server {
    listen 80;
    listen [::]:80;
    server_name ops.e-remedium.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    root /opt/health-ecosystem/ops_portal/dist;
    index index.html;

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
