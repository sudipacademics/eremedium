port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
  enable_loopback_candidate: false

turn:
  enabled: false

# No `redis:` block on purpose. LiveKit only needs Redis for multi-node routing, and this is a
# single instance, so in-memory state is correct. Configuring it here would also mean either
# committing REDIS_PASSWORD to the repo or templating this file at deploy time -- our Redis runs
# with requirepass, so a passwordless block just crash-loops on "NOAUTH Authentication required".
# When you scale to a second LiveKit node, inject the whole config via the LIVEKIT_CONFIG env var
# so the password can come from .env.

logging:
  level: info
  json: true

room:
  auto_create: false
  empty_timeout: 60
  departure_timeout: 20
  max_participants: 2

# LiveKit is the authoritative source for "is this call still happening?". Without these callbacks a
# client that vanished without hanging up left the session ACTIVE and billing every minute until the
# wallet drained, because nothing else could observe the departure.
#
# LiveKit signs each callback as a JWT whose sha256 claim covers the raw body, and the gateway
# verifies both. The signing key is named by `webhook.api_key`, which must match a key in
# LIVEKIT_KEYS.
#
# This file does NOT interpolate environment variables, so api_key is supplied separately as
# LIVEKIT_WEBHOOK_API_KEY (LiveKit maps config paths to LIVEKIT_* vars). Leaving it out here is
# deliberate: LiveKit refuses to start when webhook urls are set without an api_key, so a wrong
# variable name fails loudly at boot instead of silently disabling the callbacks.
#
# The URL is the in-cluster address, so callbacks never traverse nginx or the public internet.
webhook:
  urls:
    - http://core-gateway:8000/api/v1/rtc/webhook/livekit
