port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
  enable_loopback_candidate: false

turn:
  enabled: false

redis:
  address: redis-state:6379
  db: 1

logging:
  level: info
  json: true

room:
  auto_create: false
  empty_timeout: 60
  departure_timeout: 20
  max_participants: 2

webhook:
  api_key: ""
  urls:
    - http://core-gateway:8000/api/v1/rtc/webhook
