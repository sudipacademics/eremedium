# Overlay for deploying onto a SHARED host that already runs other production workloads
# (Hetzner 167.233.108.90: ERPNext + MariaDB + host-level Nginx on 80/443).
#
# Usage — note the -f order matters, later files override earlier ones:
#   docker compose -f docker-compose.yml -f docker-compose.shared-host.yml up -d
#
# Two goals:
#   1. Never contend for a port the production stack owns. Nothing here publishes 80/443, and the
#      LiveKit signalling ports move to loopback so only the host Nginx can reach them.
#   2. Keep memory small enough that PostgreSQL can never trigger an OOM kill against ERPNext.

services:
  postgres-db:
    # Right-sized for a shared 7.6 GB box, down from the dedicated-host defaults
    # (shared_buffers 1GB / effective_cache_size 3GB).
    command:
      - postgres
      - -c
      - max_connections=120
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - synchronous_commit=on
      - -c
      - default_transaction_isolation=read committed
      - -c
      - statement_timeout=15000
      - -c
      - idle_in_transaction_session_timeout=30000
      - -c
      - lock_timeout=5000
    deploy:
      resources:
        limits:
          memory: 1500M

  redis-state:
    # Bounded so the AOF buffer cannot grow without limit. noeviction is retained from the base
    # file: queue and lock data must never be silently dropped.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --auto-aof-rewrite-percentage
      - "100"
      - --auto-aof-rewrite-min-size
      - 64mb
      - --save
      - ""
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - noeviction
    deploy:
      resources:
        limits:
          memory: 512M

  core-gateway:
    deploy:
      resources:
        limits:
          memory: 1024M

  fastapi-astro:
    deploy:
      resources:
        limits:
          memory: 640M

  livekit-rtc:
    # Signalling and TCP fallback on loopback only: the host Nginx proxies /rtc to 127.0.0.1:7880.
    # The UDP media range must stay publicly reachable or WebRTC cannot connect.
    #
    # `!override` is required: Compose MERGES `ports` across -f files rather than replacing them, so
    # without it the base file's "7880:7880" survives alongside "127.0.0.1:7880:7880" and the
    # container fails to start with "address already in use" against itself.
    ports: !override
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "50000-50100:50000-50100/udp"
    deploy:
      resources:
        limits:
          memory: 768M
