user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
      '"status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
      '"upstream":"$upstream_addr","ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  75s;
    client_max_body_size 20m;
    server_tokens off;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_req_zone $binary_remote_addr zone=api_rl:10m rate=30r/s;

    upstream core_gateway_upstream {
        server core-gateway:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream astro_service_upstream {
        server fastapi-astro:8001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream livekit_upstream {
        server livekit-rtc:7880 max_fails=3 fail_timeout=10s;
    }

    include /etc/nginx/conf.d/*.conf;
}
