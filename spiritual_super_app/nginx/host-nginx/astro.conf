# STAGE 2 of 2 — astro.e-remedium.in served by the HOST nginx (Ubuntu package, not a container).
#
# This file is ADDITIVE. It never modifies /etc/nginx/sites-enabled/e-remedium, so the production
# vhosts (www / partners / collect / reach / erp / apex) are untouched by design.
#
# Install:
#   ln -sfn /opt/eremedium/spiritual_super_app/nginx/host-nginx/astro.conf \
#           /etc/nginx/sites-enabled/zz-astro.e-remedium.in
#   nginx -t && systemctl reload nginx
#
# WHY THE `zz-` PREFIX IS MANDATORY:
# nginx.conf does `include /etc/nginx/sites-enabled/*;` which expands alphabetically, and this
# server has NO `default_server` declared anywhere. nginx therefore treats the FIRST server block
# it loads for a given listen port as the default for unmatched Host headers. A file named
# "astro..." would sort before "e-remedium" and silently steal that role from the www vhost. The
# zz- prefix keeps the existing default intact.
#
# Uniquely prefixed upstream/variable names avoid clashing with the production file's
# health_erpnext / rfms_* upstreams.

upstream ssa_gateway {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream ssa_astro {
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream ssa_livekit {
    server 127.0.0.1:7880 max_fails=3 fail_timeout=10s;
}

# Distinct variable name: the production config defines no upgrade map, and re-declaring a
# variable that already exists is a hard nginx error.
map $http_upgrade $ssa_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name astro.e-remedium.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name astro.e-remedium.in;

    ssl_certificate     /etc/letsencrypt/live/astro.e-remedium.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astro.e-remedium.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/astro.access.log;
    error_log  /var/log/nginx/astro.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;

    # Vedic / Ayurveda compute service (FastAPI, container-published on loopback:8001).
    location /api/v1/astro {
        proxy_pass         http://ssa_astro;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location /api/v1/ayurveda {
        proxy_pass         http://ssa_astro;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Business engine + the /api/v1/ws signalling socket. The long read timeout keeps consultation
    # sockets alive for the duration of a call.
    location /api/v1 {
        proxy_pass         http://ssa_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $ssa_connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_buffering off;
    }

    # LiveKit signalling. Media does NOT pass through here: LiveKit advertises the host's public IP
    # and clients send UDP straight to 50000-50100.
    #
    # The URI is deliberately passed through UNCHANGED (no trailing slash on proxy_pass, no
    # rewrite). LiveKit's own signalling endpoint is literally /rtc and its token check is
    # /rtc/validate, so stripping the prefix makes LiveKit 404 every signalling request. Note that
    # a plain GET /rtc returns 404 even when correct -- only a websocket upgrade yields 101 -- so
    # verify with /rtc/validate, which returns 401 when routing is right.
    location /rtc {
        proxy_pass         http://ssa_livekit;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $ssa_connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://ssa_gateway/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    location = / {
        return 200 "astro.e-remedium.in ok\n";
        default_type text/plain;
    }
}
