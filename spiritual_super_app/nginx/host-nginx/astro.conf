# STAGE 2 (redirect) — astro.e-remedium.in → https://vedsutra.in
#
# Keeps the shared ssa_* upstreams and maps that zz-vedsutra.in depends on.
# App traffic for the old hostname permanently redirects to the new apex.
#
# Install:
#   ln -sfn /opt/eremedium/spiritual_super_app/nginx/host-nginx/astro.conf \
#           /etc/nginx/sites-enabled/zz-astro.e-remedium.in
#   nginx -t && systemctl reload nginx

upstream ssa_gateway {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream ssa_astro {
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream ssa_livekit {
    server 127.0.0.1:7880 max_fails=3 fail_timeout=10s;
}

upstream ssa_web {
    server 127.0.0.1:3100 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

map $http_upgrade $ssa_connection_upgrade {
    default upgrade;
    ''      close;
}

map "$ssa_ip_allowed$ssa_gate_header_ok" $ssa_api_allowed {
    default 1;
    "00"    0;
}

server {
    listen 80;
    listen [::]:80;
    server_name astro.e-remedium.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://vedsutra.in$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name astro.e-remedium.in;

    ssl_certificate     /etc/letsencrypt/live/astro.e-remedium.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astro.e-remedium.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/astro.access.log scrubbed;
    error_log  /var/log/nginx/astro.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://vedsutra.in$request_uri;
    }
}
