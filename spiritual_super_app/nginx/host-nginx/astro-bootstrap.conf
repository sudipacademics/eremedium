# STAGE 1 of 2 — ACME bootstrap for astro.e-remedium.in
#
# Purpose: serve the Let's Encrypt HTTP-01 challenge so a certificate can be issued. A server block
# cannot reference ssl_certificate before the file exists, so TLS is added in stage 2
# (astro.conf) only after certbot succeeds.
#
# Install (note the zz- prefix — see astro.conf for why the name matters):
#   ln -sfn /opt/eremedium/spiritual_super_app/nginx/host-nginx/astro-bootstrap.conf \
#           /etc/nginx/sites-enabled/zz-astro.e-remedium.in
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name astro.e-remedium.in;

    access_log /var/log/nginx/astro.access.log;
    error_log  /var/log/nginx/astro.error.log warn;

    # Matches the webroot the existing e-remedium vhosts already use.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 503 "astro.e-remedium.in: TLS provisioning in progress\n";
        default_type text/plain;
    }
}
