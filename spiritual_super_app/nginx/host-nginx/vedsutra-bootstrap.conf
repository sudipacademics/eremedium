# STAGE 1 of 2 — ACME bootstrap for vedsutra.in (+ www)
#
# Install (zz- prefix — see astro.conf for why the name matters):
#   ln -sfn /opt/eremedium/spiritual_super_app/nginx/host-nginx/vedsutra-bootstrap.conf \
#           /etc/nginx/sites-enabled/zz-vedsutra.in
#   nginx -t && systemctl reload nginx
#
# Then:
#   certbot certonly --webroot -w /var/www/certbot -d vedsutra.in -d www.vedsutra.in
# and switch the symlink to vedsutra.conf.

server {
    listen 80;
    listen [::]:80;
    server_name vedsutra.in www.vedsutra.in;

    access_log /var/log/nginx/vedsutra.access.log;
    error_log  /var/log/nginx/vedsutra.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 503 "vedsutra.in: TLS provisioning in progress — point A records to this host first\n";
        default_type text/plain;
    }
}
