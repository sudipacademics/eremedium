# astro.e-remedium.in → https://vedsutra.in (post-cutover).
# Swap zz-astro.e-remedium.in to this file after vedsutra.in TLS is live.
# Requires zz-ssa-upstreams.conf to remain enabled (vedsutra.conf depends on it).

server {
    listen 80;
    listen [::]:80;
    server_name astro.e-remedium.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://vedsutra.in$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name astro.e-remedium.in;

    ssl_certificate     /etc/letsencrypt/live/astro.e-remedium.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astro.e-remedium.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/astro.access.log scrubbed;
    error_log  /var/log/nginx/astro.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        return 301 https://vedsutra.in$request_uri;
    }
}
