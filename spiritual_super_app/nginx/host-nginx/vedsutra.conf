# STAGE 2 of 2 — vedsutra.in (+ www → apex) served by HOST nginx.
#
# REQUIRES zz-astro.e-remedium.in (or another site that defines the shared
# ssa_* upstreams and $ssa_connection_upgrade / $ssa_api_allowed maps) to stay enabled.
# This file deliberately does NOT redeclare those — duplicate upstreams would fail nginx -t.
#
# Install:
#   ln -sfn /opt/eremedium/spiritual_super_app/nginx/host-nginx/vedsutra.conf \
#           /etc/nginx/sites-enabled/zz-vedsutra.in
#   nginx -t && systemctl reload nginx

# www → apex
server {
    listen 80;
    listen [::]:80;
    server_name www.vedsutra.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://vedsutra.in$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vedsutra.in;

    ssl_certificate     /etc/letsencrypt/live/vedsutra.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vedsutra.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://vedsutra.in$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name vedsutra.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vedsutra.in;

    ssl_certificate     /etc/letsencrypt/live/vedsutra.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vedsutra.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/vedsutra.access.log scrubbed;
    error_log  /var/log/nginx/vedsutra.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;

    location /api/v1/astrologers {
        if ($ssa_api_allowed = 0) { return 403 "staging gate: X-SSA-Gate header required\n"; }
        proxy_pass         http://ssa_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location /api/v1/astro {
        if ($ssa_api_allowed = 0) { return 403 "staging gate: X-SSA-Gate header required\n"; }
        proxy_pass         http://ssa_astro;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location ^~ /api/v1/ayurveda/prakriti {
        if ($ssa_api_allowed = 0) { return 403 "staging gate: X-SSA-Gate header required\n"; }
        proxy_pass         http://ssa_astro;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location ^~ /api/v1/payments/webhook {
        proxy_pass         http://ssa_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location ^~ /api/v1/ws {
        proxy_pass         http://ssa_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $ssa_connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_buffering off;
    }

    location /api/v1 {
        if ($ssa_api_allowed = 0) { return 403 "staging gate: X-SSA-Gate header required\n"; }
        proxy_pass         http://ssa_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $ssa_connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_buffering off;
    }

    # LIVEKIT_PUBLIC_URL must be wss://vedsutra.in (no /rtc suffix).
    location /rtc {
        proxy_pass         http://ssa_livekit;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $ssa_connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://ssa_gateway/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass         http://ssa_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
