[pytest]
testpaths = tests
# Rooted at the service directory so `from app...` imports resolve without an installed package.
pythonpath = .
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning
    # Starlette's TestClient still imports the old anyio.abc alias; the warning is theirs, not ours.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
