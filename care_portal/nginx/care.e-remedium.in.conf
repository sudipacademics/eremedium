# Remedium Care backend portal — care.e-remedium.in
# Same Hetzner host as remediumlabs.in (167.233.108.90).
# Static root: /opt/health-ecosystem/care_portal/dist
# Care API (systemd care-api.service): 127.0.0.1:8095
# Install this file after the certificate exists:
#   /etc/nginx/sites-available/care.e-remedium.in

server {
    listen 80;
    listen [::]:80;
    server_name care.e-remedium.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://care.e-remedium.in$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name care.e-remedium.in;

    ssl_certificate     /etc/letsencrypt/live/care.e-remedium.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/care.e-remedium.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/health-ecosystem/care_portal/dist;
    index index.html;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location /care-api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8095;
    }

    # Remedium Aesthetic session pages (same engine, own data in aes-api.service on 127.0.0.1:8096),
    # framed by the Aesthetic console at aesthetics.e-remedium.in.
    location /aes-api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8096/care-api/;
    }

    location ^~ /aes-sessions/assets/ {
        alias /opt/health-ecosystem/care_portal/dist-aesthetic/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /aes-sessions/ {
        alias /opt/health-ecosystem/care_portal/dist-aesthetic/;
        try_files $uri $uri/ /aes-sessions/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors https://aesthetics.e-remedium.in" always;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host www.remediumlabs.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name health.localhost;
        proxy_read_timeout 120s;
        proxy_pass http://health_erpnext;
    }

    location /files/ {
        proxy_http_version 1.1;
        proxy_set_header Host www.remediumlabs.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name health.localhost;
        proxy_pass http://health_erpnext;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
